<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AURA | My Appointments</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{brandGold:'#D4AF37',darkBg:'#0F1115',darkCard:'#181B20',darkBorder:'#2A2E37'},fontFamily:{serif:['Cinzel','serif'],sans:['Inter','sans-serif']}}}}</script></head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen"><nav class="border-b border-darkBorder bg-darkCard/70 py-4 px-6"><div class="max-w-7xl mx-auto flex justify-between items-center gap-4"><a href="index.html" class="font-serif text-xl font-bold tracking-widest text-white">AURA HAIR STUDIO</a><div class="flex gap-4 text-sm"><a href="index.html" class="text-brandGold">New Booking</a><button id="logoutBtn" class="text-red-400 hover:text-red-300">Logout</button></div></div></nav>
<main class="max-w-5xl mx-auto py-12 px-4"><header class="mb-8"><h1 class="font-serif text-3xl font-bold text-white">My Appointments</h1><p id="welcome" class="text-gray-400 text-sm mt-2">Your appointments saved in the AURA database.</p></header><div id="message" class="hidden mb-5 rounded-lg border p-3 text-sm" role="status"></div><div id="appointments" class="grid gap-4"><div class="bg-darkCard border border-darkBorder rounded-xl p-6 text-gray-400">Loading appointments...</div></div></main>
<script>
const $=id=>document.getElementById(id);const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function show(text,ok=false){const m=$('message');m.textContent=text;m.className='mb-5 rounded-lg border p-3 text-sm '+(ok?'border-green-700 bg-green-900/20 text-green-300':'border-red-700 bg-red-900/20 text-red-300');}
function statusClass(s){if(s==='Completed')return 'bg-green-900/30 text-green-300 border-green-700';if(s==='Cancelled')return 'bg-red-900/30 text-red-300 border-red-700';if(s==='Confirmed')return 'bg-blue-900/30 text-blue-300 border-blue-700';return 'bg-yellow-900/30 text-yellow-300 border-yellow-700';}
async function load(){try{const me=await fetch('/api/auth/me');if(!me.ok){location.href='login.html';return;}const user=(await me.json()).user;if(user.role==='admin'){location.href='admin.html';return;}$('welcome').textContent='Welcome, '+user.name+'. Your appointments are saved in the AURA database.';const r=await fetch('/api/appointments/my');const data=await r.json();if(!r.ok)throw new Error(data.error||'Could not load appointments.');const list=$('appointments');if(!data.length){list.innerHTML='<div class="bg-darkCard border border-darkBorder rounded-xl p-8 text-center"><p class="text-gray-300 mb-4">You do not have any appointments yet.</p><a href="index.html" class="inline-block bg-brandGold text-black font-bold px-5 py-3 rounded-lg">Book an Appointment</a></div>';return;}list.innerHTML=data.map(a=>`<article class="bg-darkCard border border-darkBorder rounded-xl p-6"><div class="flex flex-col md:flex-row md:justify-between md:items-start gap-4"><div><div class="flex flex-wrap items-center gap-3 mb-3"><h2 class="font-serif text-xl text-white font-bold">${esc(a.service_name)}</h2><span class="text-xs border rounded-full px-3 py-1 ${statusClass(a.status)}">${esc(a.status||'Pending')}</span></div><p class="text-sm text-gray-400">${esc(a.hair_length)} hair · ${esc(a.stylist_name||'AURA Stylist')}</p><p class="text-sm text-gray-300 mt-3">Date: <strong>${esc(a.appointment_date)}</strong> · Starts: <strong>${esc(a.start_time)}</strong></p><p class="text-sm text-gray-400 mt-1">Estimated completion: ${esc(a.estimated_completion_time||'—')} · Duration: ${esc(a.duration_minutes)} minutes</p></div><div class="md:text-right"><p class="font-serif text-2xl text-brandGold font-bold">${peso(a.total_price_php)}</p><p class="text-xs text-gray-500 mt-1">Appointment #${esc(a.id)}</p>${['Pending','Confirmed'].includes(a.status)?`<button data-cancel="${Number(a.id)}" class="mt-4 border border-red-800 text-red-300 hover:bg-red-900/30 rounded-lg px-4 py-2 text-sm">Cancel appointment</button>`:''}</div></div></article>`).join('');}catch(e){$('appointments').innerHTML='';show(e.message);}}
$('appointments').addEventListener('click',async e=>{const b=e.target.closest('[data-cancel]');if(!b)return;if(!confirm('Delete this appointment?'))return;b.disabled=true;try{const r=await fetch('/api/appointments/'+b.dataset.cancel,{method:'DELETE'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not delete appointment.');show('Appointment deleted.',true);await load();}catch(err){show(err.message);b.disabled=false;}});
$('logoutBtn').addEventListener('click',async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='login.html';});
const params=new URLSearchParams(location.search);if(params.has('booked'))show('Your appointment was saved successfully.',true);load();
</script></body></html>
