<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Customer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGold: '#D4AF37', darkBg: '#0F1115', darkCard: '#181B20', darkBorder: '#2A2E37' },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen">
  <nav class="border-b border-darkBorder bg-darkCard/50 backdrop-blur-md sticky top-0 z-50 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="font-serif text-xl font-bold tracking-widest text-white">AURA HAIR STUDIO</span>
      </div>
      <a href="index.html" class="text-sm font-medium hover:text-brandGold transition">New Booking</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto py-12 px-4">
    <div class="bg-darkCard border border-darkBorder rounded-xl p-8 shadow-2xl text-center">
      <h1 class="font-serif text-3xl font-bold text-white mb-2">MY APPOINTMENT STATUS</h1>
      <p class="text-gray-400 text-sm mb-6">Real-time status updates for your booking</p>

      <div id="bookingDetails" class="bg-darkBg border border-darkBorder rounded-lg p-6 space-y-4 text-left">
        <p class="text-gray-400 text-center">Loading ticket details...</p>
      </div>

      <div class="mt-8">
        <a href="index.html" class="inline-block bg-brandGold hover:bg-yellow-600 text-black font-bold px-6 py-3 rounded-lg transition">
          Book Another Service
        </a>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBUwARR2QRgd-NOhuLJPBKXSzmq-Rt9cd8",
      authDomain: "aura-hair-studio-a13e1.firebaseapp.com",
      databaseURL: "https://aura-hair-studio-a13e1-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "aura-hair-studio-a13e1",
      storageBucket: "aura-hair-studio-a13e1.firebasestorage.app",
      messagingSenderId: "72075304715",
      appId: "1:72075304715:web:ded49e67b0844e52b60c0e",
      measurementId: "G-SHJRN0N7W1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const currentId = localStorage.getItem('aura_current_id');
    const container = document.getElementById('bookingDetails');

    if (currentId) {
      // Listen to the 'queue/' database node set by index.html
      database.ref('queue/' + currentId).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          container.innerHTML = `
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Customer Name:</span>
              <span class="text-white font-semibold">${data.name || data.clientName || 'N/A'}</span>
            </div>
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Service:</span>
              <span class="text-white font-semibold">${data.service || 'N/A'}</span>
            </div>
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Phone / Contact:</span>
              <span class="text-white font-semibold">${data.phone || data.contact || 'N/A'}</span>
            </div>
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Price:</span>
              <span class="text-brandGold font-bold">${data.price || 'N/A'}</span>
            </div>
            <div class="flex justify-between items-center pt-2">
              <span class="text-gray-400">Queue Status:</span>
              <span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-3 py-1 rounded-full text-xs font-bold">${data.status || 'Waiting'}</span>
            </div>
          `;
        } else {
          container.innerHTML = `<p class="text-gray-400 text-center">No active bookings found.</p>`;
        }
      });
    } else {
      // Fallback: Fetch the most recent booking submitted from this device
      database.ref('queue').limitToLast(1).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const key = Object.keys(data)[0];
          const item = data[key];
          container.innerHTML = `
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Customer Name:</span>
              <span class="text-white font-semibold">${item.name || item.clientName || 'N/A'}</span>
            </div>
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Service:</span>
              <span class="text-white font-semibold">${item.service || 'N/A'}</span>
            </div>
            <div class="flex justify-between border-b border-darkBorder pb-2">
              <span class="text-gray-400">Price:</span>
              <span class="text-brandGold font-bold">${item.price || 'N/A'}</span>
            </div>
            <div class="flex justify-between items-center pt-2">
              <span class="text-gray-400">Queue Status:</span>
              <span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-3 py-1 rounded-full text-xs font-bold">${item.status || 'Waiting'}</span>
            </div>
          `;
        } else {
          container.innerHTML = `<p class="text-gray-400 text-center">No active bookings found.</p>`;
        }
      });
    }
  </script>
</body>
</html>
