<body class="bg-darkBg text-gray-200 font-sans min-h-screen">

  <!-- Main Booking Calculator -->
  <main class="max-w-4xl mx-auto py-12 px-4">

      <form id="bookingForm" class="space-y-6">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    /*
      This page uses Firebase Realtime Database for booking submissions.
      Make sure your Firebase project and database security rules are configured.
    */

    const firebaseConfig = {
      apiKey: "AIzaSyBUwARR2QRgd-NOhuLJPBKXSzmq-Rt9cd8",
      authDomain: "aura-hair-studio-a13e1.firebaseapp.com",
      databaseURL: "https://aura-hair-studio-a13e1-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "aura-hair-studio-a13e1",
      storageBucket: "Yaura-hair-studio-a13e1.firebasestorage.app",
      messagingSenderId: "72075304715",
      appId: "1:72075304715:web:ded49e67b0844e52b60c0e"
    };

    const bookingForm = document.getElementById('bookingForm');
    const serviceSelect = document.getElementById('serviceSelect');
    const totalPriceDisplay = document.getElementById('totalPriceDisplay');
    const bookingMessage = document.getElementById('bookingMessage');
    const bookingButton = document.getElementById('bookingButton');

    let database = null;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      database = firebase.database();
    } catch (error) {
      console.error('Firebase initialization failed:', error);
    }

    function calculateTotal() {
      let total = Number(serviceSelect.value);

      document.querySelectorAll('.addon-check:checked').forEach((checkbox) => {
        total += Number(checkbox.value);
      });

      totalPriceDisplay.textContent = '$' + total.toFixed(2);

      return total;
    }

    serviceSelect.addEventListener('change', calculateTotal);

    document.querySelectorAll('.addon-check').forEach((checkbox) => {
      checkbox.addEventListener('change', calculateTotal);
    });

    bookingForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      if (!database) {
        bookingMessage.textContent =
          'Booking is temporarily unavailable. Please try again later.';
        bookingMessage.className = 'text-sm text-red-400';
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();

      if (!name || !phone) {
        bookingMessage.textContent = 'Please enter your name and phone number.';
        bookingMessage.className = 'text-sm text-red-400';
        return;
      }

      const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
      const total = calculateTotal();

      const selectedAddons = Array.from(
        document.querySelectorAll('.addon-check:checked')
      ).map((checkbox) => checkbox.parentElement.innerText.trim());

      const newBooking = {
        name: name,
        phone: phone,
        service: selectedOption.text.split(' - ')[0],
        addons: selectedAddons,
        price: '$' + total.toFixed(2),
        status: 'Waiting',
        timestamp: new Date().toISOString()
      };

      bookingButton.disabled = true;
      bookingButton.textContent = 'Submitting...';
      bookingMessage.textContent = '';

      try {
        const newRef = database.ref('queue').push();
        await newRef.set(newBooking);

        localStorage.setItem('aura_current_id', newRef.key);

        window.location.href = '/aura-hair-studio/dashboard.html';
      } catch (error) {
        console.error('Booking failed:', error);

        bookingMessage.textContent =
          'Unable to submit your booking. Please check your connection or try again.';
        bookingMessage.className = 'text-sm text-red-400';

        bookingButton.disabled = false;
        bookingButton.textContent = 'Confirm Appointment & Join Queue';
      }
    });

    calculateTotal();
  </script>

</body>
</html>
