<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Admin Queue Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGold: '#D4AF37', darkBg: '#0F1115', darkCard: '#181B20', darkBorder: '#2A2E37' },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen">
  <nav class="border-b border-darkBorder bg-darkCard/50 backdrop-blur-md sticky top-0 z-50 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <span class="font-serif text-xl font-bold tracking-widest text-white">AURA ADMIN PANEL</span>
      <button onclick="handleLogout()" class="text-sm font-medium text-red-400 hover:text-red-300 transition cursor-pointer">Logout</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto py-10 px-4">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="font-serif text-3xl font-bold text-white">Master Queue Management</h1>
        <p class="text-gray-400 text-sm">Live appointment entries updated in real-time</p>
      </div>
      <button onclick="clearAll()" class="bg-red-900/40 text-red-300 border border-red-700/50 hover:bg-red-900/70 font-semibold px-4 py-2 rounded-lg text-sm transition cursor-pointer">
        Clear Entire Queue
      </button>
    </div>

    <div class="bg-darkCard border border-darkBorder rounded-xl overflow-hidden shadow-2xl">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-darkBorder bg-darkBg/60 text-xs uppercase tracking-wider text-gray-400">
            <th class="p-4">Time</th>
            <th class="p-4">Customer</th>
            <th class="p-4">Service</th>
            <th class="p-4">Price</th>
            <th class="p-4">Status</th>
            <th class="p-4">Actions</th>
          </tr>
        </thead>
        <tbody id="queueList" class="divide-y divide-darkBorder text-sm">
          <tr><td colspan="6" class="p-4 text-center text-gray-500">Loading live queue data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBUwARR2QRgd-NOhuLJPBKXSzmq-Rt9cd8",
      authDomain: "aura-hair-studio-a13e1.firebaseapp.com",
      databaseURL: "https://aura-hair-studio-a13e1-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "aura-hair-studio-a13e1",
      storageBucket: "aura-hair-studio-a13e1.firebasestorage.app",
      messagingSenderId: "72075304715",
      appId: "1:72075304715:web:ded49e67b0844e52b60c0e"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    // Guard: Kick unauthenticated visitors back to login page
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'login.html';
      }
    });

    function handleLogout() {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }

    database.ref('queue').on('value', (snapshot) => {
      const queueData = snapshot.val();
      const tbody = document.getElementById('queueList');

      if (!queueData) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No customer appointments currently in queue.</td></tr>`;
        return;
      }

      let rows = '';
      Object.keys(queueData).forEach((key) => {
        const item = queueData[key];
        rows += `
          <tr class="hover:bg-darkBg/40 transition">
            <td class="p-4 text-gray-400">${item.timestamp}</td>
            <td class="p-4 font-semibold text-white">${item.name}<br><span class="text-xs text-gray-500">${item.phone}</span></td>
            <td class="p-4">${item.service}</td>
            <td class="p-4 text-brandGold font-bold">${item.price}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${item.status === 'Completed' ? 'bg-green-900/40 text-green-400 border border-green-500/40' : 'bg-yellow-900/40 text-yellow-400 border border-yellow-500/40'}">
                ${item.status}
              </span>
            </td>
            <td class="p-4 space-x-2">
              <button onclick="toggleStatus('${key}', '${item.status}')" class="bg-brandGold text-black font-bold px-3 py-1 rounded text-xs hover:bg-yellow-500 cursor-pointer">Toggle Status</button>
              <button onclick="deleteBooking('${key}')" class="bg-red-900/50 text-red-300 px-2.5 py-1 rounded text-xs hover:bg-red-800 cursor-pointer">Delete</button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = rows;
    });

    function toggleStatus(key, currentStatus) {
      const newStatus = currentStatus === 'Waiting' ? 'Completed' : 'Waiting';
      database.ref('queue/' + key).update({ status: newStatus });
    }

    function deleteBooking(key) {
      database.ref('queue/' + key).remove();
    }

    function clearAll() {
      if (confirm('Clear the entire appointment queue?')) {
        database.ref('queue').remove();
      }
    }
  </script>
</body>
</html>
