<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Hair & Perm | Client Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGold: '#D4AF37', darkBg: '#0F1115', darkCard: '#181B20', darkBorder: '#2A2E37' },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-darkCard border border-darkBorder p-8 rounded-xl shadow-2xl relative">
    <div class="text-center mb-8">
      <a href="/"><img src="/logo.png" alt="Aura Logo" class="h-16 mx-auto mb-3" onerror="this.src='https://via.placeholder.com/64?text=AURA'"></a>
      <h2 class="font-serif text-2xl font-bold text-white tracking-wider">AURA MEN'S STUDIO</h2>
      <p class="text-xs text-gray-400 mt-1" id="formSubtitle">Sign in to manage your appointments and queue</p>
    </div>

    <div class="flex border-b border-darkBorder mb-6">
      <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 text-center text-sm font-semibold border-b-2 border-brandGold text-brandGold">Login</button>
      <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 text-center text-sm font-semibold text-gray-400 hover:text-white">Register</button>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Email Address</label>
        <input type="email" id="loginEmail" required class="w-full bg-darkBg border border-darkBorder rounded px-3 py-2.5 text-sm text-white focus:border-brandGold outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full bg-darkBg border border-darkBorder rounded px-3 py-2.5 text-sm text-white focus:border-brandGold outline-none">
      </div>
      <button type="submit" class="w-full bg-brandGold text-black font-semibold text-sm py-3 rounded hover:bg-yellow-500 transition mt-2">Sign In</button>
    </form>

    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Full Name</label>
        <input type="text" id="regName" required class="w-full bg-darkBg border border-darkBorder rounded px-3 py-2.5 text-sm text-white focus:border-brandGold outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Email Address</label>
        <input type="email" id="regEmail" required class="w-full bg-darkBg border border-darkBorder rounded px-3 py-2.5 text-sm text-white focus:border-brandGold outline-none">
      </div>
      <div>
        <label class="block text-xs uppercase font-semibold text-gray-400 mb-1">Password</label>
        <input type="password" id="regPassword" required class="w-full bg-darkBg border border-darkBorder rounded px-3 py-2.5 text-sm text-white focus:border-brandGold outline-none">
      </div>
      <button type="submit" class="w-full bg-brandGold text-black font-semibold text-sm py-3 rounded hover:bg-yellow-500 transition mt-2">Create Account</button>
    </form>

    <div class="mt-6 text-center">
      <a href="/" class="text-xs text-gray-400 hover:text-brandGold">← Back to Main Studio</a>
    </div>
  </div>

  <script>
    function switchTab(type) {
      if (type === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLogin').className = 'flex-1 py-2 text-center text-sm font-semibold border-b-2 border-brandGold text-brandGold';
        document.getElementById('tabRegister').className = 'flex-1 py-2 text-center text-sm font-semibold text-gray-400 hover:text-white';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegister').className = 'flex-1 py-2 text-center text-sm font-semibold border-b-2 border-brandGold text-brandGold';
        document.getElementById('tabLogin').className = 'flex-1 py-2 text-center text-sm font-semibold text-gray-400 hover:text-white';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
      } else {
        alert(data.error);
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value
        })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/dashboard.html';
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
