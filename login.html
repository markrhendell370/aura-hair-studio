<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Login & Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{brandGold:'#D4AF37',darkBg:'#0F1115',darkCard:'#181B20',darkBorder:'#2A2E37'},fontFamily:{serif:['Cinzel','serif'],sans:['Inter','sans-serif']}}}}</script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex items-center justify-center p-4">
  <main class="max-w-md w-full bg-darkCard border border-darkBorder rounded-xl p-8 shadow-2xl">
    <header class="text-center mb-6"><div class="inline-block bg-gray-400/20 px-4 py-2 rounded-lg mb-3 font-serif text-brandGold tracking-widest">AURA</div><h1 class="font-serif text-2xl font-bold text-white tracking-wider">AURA HAIR STUDIO</h1><p class="text-gray-400 text-xs mt-2">Sign in to book and manage appointments</p></header>
    <div class="flex border-b border-darkBorder mb-6"><button id="loginTabBtn" type="button" onclick="switchTab('login')" class="w-1/2 py-2 font-semibold text-brandGold border-b-2 border-brandGold">Login</button><button id="registerTabBtn" type="button" onclick="switchTab('register')" class="w-1/2 py-2 font-semibold text-gray-400">Register</button></div>
    <div id="message" class="hidden mb-4 rounded-lg border p-3 text-sm" role="status"></div>
    <form id="loginForm" class="space-y-4">
      <div><label for="loginEmail" class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Email address</label><input id="loginEmail" type="email" required autocomplete="username" class="w-full bg-darkBg border border-darkBorder rounded-lg p-3 text-white outline-none focus:border-brandGold"></div>
      <div><label for="loginPassword" class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Password</label><input id="loginPassword" type="password" required autocomplete="current-password" class="w-full bg-darkBg border border-darkBorder rounded-lg p-3 text-white outline-none focus:border-brandGold"></div>
      <button id="loginSubmitBtn" class="w-full bg-brandGold hover:bg-yellow-600 text-black font-bold py-3 rounded-lg">Sign In</button>
    </form>
    <form id="registerForm" class="space-y-4 hidden">
      <div><label for="regName" class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Full name</label><input id="regName" type="text" required maxlength="100" autocomplete="name" class="w-full bg-darkBg border border-darkBorder rounded-lg p-3 text-white outline-none focus:border-brandGold"></div>
      <div><label for="regEmail" class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Email address</label><input id="regEmail" type="email" required autocomplete="email" class="w-full bg-darkBg border border-darkBorder rounded-lg p-3 text-white outline-none focus:border-brandGold"></div>
      <div><label for="regPassword" class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Password (at least 8 characters)</label><input id="regPassword" type="password" required minlength="8" autocomplete="new-password" class="w-full bg-darkBg border border-darkBorder rounded-lg p-3 text-white outline-none focus:border-brandGold"></div>
      <button id="regSubmitBtn" class="w-full bg-brandGold hover:bg-yellow-600 text-black font-bold py-3 rounded-lg">Create Customer Account</button>
    </form>
    <div class="mt-6 text-center"><a href="index.html" class="text-xs text-gray-400 hover:text-brandGold">← Back to Main Studio</a></div>
  </main>
<script>
const $=id=>document.getElementById(id);
function showMessage(text,ok=false){const m=$('message');m.textContent=text;m.className='mb-4 rounded-lg border p-3 text-sm '+(ok?'border-green-700 bg-green-900/20 text-green-300':'border-red-700 bg-red-900/20 text-red-300');}
function switchTab(tab){const login=tab==='login';$('loginForm').classList.toggle('hidden',!login);$('registerForm').classList.toggle('hidden',login);$('loginTabBtn').className='w-1/2 py-2 font-semibold '+(login?'text-brandGold border-b-2 border-brandGold':'text-gray-400');$('registerTabBtn').className='w-1/2 py-2 font-semibold '+(!login?'text-brandGold border-b-2 border-brandGold':'text-gray-400');$('message').classList.add('hidden');}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const data=await r.json().catch(()=>({error:'Unexpected server response.'}));if(!r.ok)throw new Error(data.error||'Request failed.');return data;}
async function redirectForUser(user){window.location.href=user.role==='admin'?'admin.html':'dashboard.html';}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('loginSubmitBtn');b.disabled=true;b.textContent='Signing in...';try{const d=await api('/api/auth/login',{email:$('loginEmail').value.trim(),password:$('loginPassword').value});await redirectForUser(d.user);}catch(err){showMessage(err.message);}finally{b.disabled=false;b.textContent='Sign In';}});
$('registerForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('regSubmitBtn');b.disabled=true;b.textContent='Creating account...';try{const d=await api('/api/auth/register',{name:$('regName').value.trim(),email:$('regEmail').value.trim(),password:$('regPassword').value});showMessage('Account created. Welcome to AURA!',true);await redirectForUser(d.user);}catch(err){showMessage(err.message);}finally{b.disabled=false;b.textContent='Create Customer Account';}});
(async()=>{try{const r=await fetch('/api/auth/me',{credentials:'same-origin'});if(r.ok){const d=await r.json();await redirectForUser(d.user);}}catch(e){}})();
</script>
</body></html>
