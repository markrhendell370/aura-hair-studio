<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Customer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGold: '#D4AF37', darkBg: '#0F1115', darkCard: '#181B20', darkBorder: '#2A2E37' },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen p-6">
  <div class="max-w-2xl mx-auto bg-darkCard border border-darkBorder rounded-xl p-8 shadow-2xl text-center">
    <h1 class="font-serif text-3xl font-bold text-white mb-2">My Appointment Status</h1>
    <p class="text-gray-400 text-sm mb-6">Real-time status updates for your booking</p>

    <div id="bookingDetails" class="bg-darkBg border border-darkBorder rounded-lg p-6 space-y-4 text-left">
      <p class="text-gray-400 text-center">Loading ticket details...</p>
    </div>

    <div class="mt-8">
      <a href="index.html" class="inline-block bg-brandGold hover:bg-yellow-600 text-black font-bold px-6 py-3 rounded-lg transition">
        Book Another Service
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBUwARR2QRgd-NOhuLJPBKXSzmq-Rt9cd8",
      authDomain: "aura-hair-studio-a13e1.firebaseapp.com",
      databaseURL: "https://aura-hair-studio-a13e1-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "aura-hair-studio-a13e1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    database.ref('appointments').limitToLast(1).on('value', (snapshot) => {
      const data = snapshot.val();
      const container = document.getElementById('bookingDetails');
      if (data) {
        const key = Object.keys(data)[0];
        const item = data[key];
        container.innerHTML = `
          <div class="flex justify-between border-b border-darkBorder pb-2">
            <span class="text-gray-400">Customer Name:</span>
            <span class="text-white font-semibold">${item.clientName}</span>
          </div>
          <div class="flex justify-between border-b border-darkBorder pb-2">
            <span class="text-gray-400">Service:</span>
            <span class="text-white font-semibold">${item.service} (${item.length})</span>
          </div>
          <div class="flex justify-between border-b border-darkBorder pb-2">
            <span class="text-gray-400">Date & Time:</span>
            <span class="text-white font-semibold">${item.date} @ ${item.timeSlot}</span>
          </div>
          <div class="flex justify-between border-b border-darkBorder pb-2">
            <span class="text-gray-400">Calculated Price:</span>
            <span class="text-brandGold font-bold">${item.price}</span>
          </div>
          <div class="flex justify-between items-center pt-2">
            <span class="text-gray-400">Queue Status:</span>
            <span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-3 py-1 rounded-full text-xs font-bold">${item.status || 'Pending'}</span>
          </div>
        `;
      } else {
        container.innerHTML = `<p class="text-gray-400 text-center">No active bookings found.</p>`;
      }
    });
  </script>
</body>
</html>
