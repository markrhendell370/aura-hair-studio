<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | Master Appointments Queue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGold: '#D4AF37', darkBg: '#0F1115', darkCard: '#181B20', darkBorder: '#2A2E37' },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="font-serif text-3xl font-bold text-white">MASTER APPOINTMENTS QUEUE</h1>
        <p class="text-gray-400 text-sm">Real-time status management across all appointments</p>
      </div>
      <a href="index.html" class="text-xs bg-darkCard border border-darkBorder px-4 py-2 rounded text-gray-300 hover:text-white">Back to Main Studio</a>
    </div>

    <div class="bg-darkCard border border-darkBorder rounded-xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-darkBorder bg-darkBg/60 text-xs uppercase tracking-wider text-gray-400">
              <th class="p-4">CLIENT</th>
              <th class="p-4">CONTACT</th>
              <th class="p-4">SERVICE</th>
              <th class="p-4">DATE & TIME</th>
              <th class="p-4">PRICE</th>
              <th class="p-4">STATUS</th>
              <th class="p-4">ACTION</th>
            </tr>
          </thead>
          <tbody id="queueList" class="divide-y divide-darkBorder text-sm">
            <tr><td colspan="7" class="p-4 text-center text-gray-500">Loading appointments...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBUwARR2QRgd-NOhuLJPBKXSzmq-Rt9cd8",
      authDomain: "aura-hair-studio-a13e1.firebaseapp.com",
      databaseURL: "https://aura-hair-studio-a13e1-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "aura-hair-studio-a13e1",
      storageBucket: "aura-hair-studio-a13e1.firebasestorage.app",
      messagingSenderId: "72075304715",
      appId: "1:72075304715:web:ded49e67b0844e52b60c0e",
      measurementId: "G-SHJRN0N7W1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Listen to the 'queue' node used by index.html
    database.ref('queue').on('value', (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('queueList');

      if (!data) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">No appointments currently booked.</td></tr>`;
        return;
      }

      let rows = '';
      Object.keys(data).forEach((key) => {
        const item = data[key];
        rows += `
          <tr class="hover:bg-darkBg/40 transition">
            <td class="p-4 font-semibold text-white">${item.name || item.clientName || 'N/A'}</td>
            <td class="p-4 text-gray-400 text-xs">${item.phone || item.contact || 'N/A'}</td>
            <td class="p-4">${item.service || 'N/A'} ${item.length ? `(${item.length})` : ''}</td>
            <td class="p-4 text-xs text-gray-300">${item.date || 'Today'} @ ${item.timeSlot || item.timestamp || 'N/A'}</td>
            <td class="p-4 text-brandGold font-bold">${item.price || 'N/A'}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold ${
                item.status === 'Completed' 
                  ? 'bg-green-900/40 text-green-400 border border-green-500/40' 
                  : 'bg-yellow-900/40 text-yellow-400 border border-yellow-500/40'
              }">
                ${item.status || 'Waiting'}
              </span>
            </td>
            <td class="p-4 space-x-2">
              <button onclick="toggleStatus('${key}', '${item.status || 'Waiting'}')" class="bg-brandGold text-black font-bold px-3 py-1 rounded text-xs hover:bg-yellow-500 transition">Toggle Status</button>
              <button onclick="deleteBooking('${key}')" class="bg-red-900/50 text-red-300 px-2.5 py-1 rounded text-xs hover:bg-red-800 transition">Cancel</button>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = rows;
    });

    function toggleStatus(key, currentStatus) {
      const newStatus = (currentStatus === 'Waiting' || currentStatus === 'Pending') ? 'Completed' : 'Waiting';
      database.ref('queue/' + key).update({ status: newStatus });
    }

    function deleteBooking(key) {
      if (confirm("Are you sure you want to cancel this appointment?")) {
        database.ref('queue/' + key).remove();
      }
    }
  </script>
</body>
</html>
