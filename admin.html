<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Queue Control | Aura Hair Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brandGold: '#D4AF37', darkBg: '#0F1115', darkCard: '#181B20', darkBorder: '#2A2E37' },
          fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen">

  <nav class="border-b border-darkBorder bg-darkCard/50 py-4">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="/logo.png" alt="Aura" class="h-10" onerror="this.src='https://via.placeholder.com/40?text=AURA'">
        <span class="font-serif font-bold text-lg text-white">AURA MASTER QUEUE</span>
      </div>
      <button onclick="logout()" class="text-xs bg-darkBorder px-3 py-1.5 rounded text-gray-300 hover:text-white">Logout Admin</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-10">
    <h1 class="font-serif text-3xl font-bold text-white mb-2">Master Appointments Queue</h1>
    <p class="text-xs text-gray-400 mb-8">Manage live queue status updates for all salon customers in real-time.</p>

    <div class="bg-darkCard border border-darkBorder rounded-xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-black/40 text-xs uppercase font-semibold text-gray-400 border-b border-darkBorder">
            <tr>
              <th class="p-4">Client</th>
              <th class="p-4">Service</th>
              <th class="p-4">Length</th>
              <th class="p-4">Specialist</th>
              <th class="p-4">Date & Start</th>
              <th class="p-4">ETC</th>
              <th class="p-4">Total Price</th>
              <th class="p-4">Queue Status</th>
            </tr>
          </thead>
          <tbody id="adminBody" class="divide-y divide-darkBorder">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    async function init() {
      const authRes = await fetch('/api/auth/me');
      if (!authRes.ok) { window.location.href = '/login.html'; return; }
      const { user } = await authRes.json();
      if (user.role !== 'admin') { window.location.href = '/dashboard.html'; return; }

      loadMasterQueue();
    }

    async function loadMasterQueue() {
      const res = await fetch('/api/appointments/all');
      const data = await res.json();
      const tbody = document.getElementById('adminBody');

      tbody.innerHTML = data.map(a => `
        <tr class="hover:bg-darkBg/50 transition">
          <td class="p-4 font-semibold text-white">${a.client_name}</td>
          <td class="p-4">${a.service_name}</td>
          <td class="p-4">${a.hair_length}</td>
          <td class="p-4 text-brandGold font-medium">${a.stylist_name || 'Master Barber Alex'}</td>
          <td class="p-4">${a.appointment_date} @ ${a.start_time}</td>
          <td class="p-4 text-brandGold font-mono">${a.estimated_completion_time}</td>
          <td class="p-4 font-bold text-white">₱${a.total_price_php.toLocaleString()}</td>
          <td class="p-4">
            <select onchange="updateStatus(${a.id}, this.value)" class="bg-darkBg border border-darkBorder rounded px-2.5 py-1 text-xs text-white focus:border-brandGold outline-none">
              <option value="Pending" ${a.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="In-Progress" ${a.status === 'In-Progress' ? 'selected' : ''}>In-Progress</option>
              <option value="Completed" ${a.status === 'Completed' ? 'selected' : ''}>Completed</option>
              <option value="Cancelled" ${a.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, newStatus) {
      await fetch(`/api/appointments/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      loadMasterQueue();
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    init();
  </script>
</body>
</html>
