<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AURA | Admin Appointment Management</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{brandGold:'#D4AF37',darkBg:'#0F1115',darkCard:'#181B20',darkBorder:'#2A2E37'},fontFamily:{serif:['Cinzel','serif'],sans:['Inter','sans-serif']}}}}</script></head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen"><nav class="border-b border-darkBorder bg-darkCard/70 py-4 px-6"><div class="max-w-7xl mx-auto flex justify-between items-center gap-4"><span class="font-serif text-xl font-bold tracking-widest text-white">AURA ADMIN PANEL</span><div class="flex gap-4 text-sm"><a href="index.html" class="text-brandGold">Booking Site</a><button id="logoutBtn" class="text-red-400 hover:text-red-300">Logout</button></div></div></nav>
<main class="max-w-7xl mx-auto py-10 px-4"><div class="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-8"><div><h1 class="font-serif text-3xl font-bold text-white">Appointment Management</h1><p id="adminWelcome" class="text-gray-400 text-sm mt-2">Appointments stored in SQLite.</p></div><button id="refreshBtn" class="border border-darkBorder hover:border-brandGold rounded-lg px-4 py-2 text-sm">Refresh appointments</button></div><div id="message" class="hidden mb-5 rounded-lg border p-3 text-sm" role="status"></div><div class="bg-darkCard border border-darkBorder rounded-xl overflow-hidden shadow-2xl"><div class="overflow-x-auto"><table class="w-full text-left border-collapse min-w-[900px]"><thead><tr class="border-b border-darkBorder bg-darkBg/60 text-xs uppercase tracking-wider text-gray-400"><th class="p-4">Date / Time</th><th class="p-4">Customer</th><th class="p-4">Service</th><th class="p-4">Price</th><th class="p-4">Status</th><th class="p-4">Actions</th></tr></thead><tbody id="appointmentList" class="divide-y divide-darkBorder text-sm"><tr><td colspan="6" class="p-6 text-center text-gray-500">Loading appointments...</td></tr></tbody></table></div></div><p class="text-xs text-gray-500 mt-4">This panel reads and updates appointments in your local SQLite database. Firebase queue entries are not imported.</p></main>
<script>
const $=id=>document.getElementById(id);const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function show(text,ok=false){const m=$('message');m.textContent=text;m.className='mb-5 rounded-lg border p-3 text-sm '+(ok?'border-green-700 bg-green-900/20 text-green-300':'border-red-700 bg-red-900/20 text-red-300');}function statusClass(s){if(s==='Completed')return 'bg-green-900/30 text-green-300 border-green-700';if(s==='Cancelled')return 'bg-red-900/30 text-red-300 border-red-700';if(s==='Confirmed')return 'bg-blue-900/30 text-blue-300 border-blue-700';if(s==='In Progress')return 'bg-purple-900/30 text-purple-300 border-purple-700';return 'bg-yellow-900/30 text-yellow-300 border-yellow-700';}
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({error:'Unexpected server response.'}));if(!r.ok)throw new Error(d.error||'Request failed.');return d;}
async function load(){try{const me=await api('/api/auth/me');if(me.user.role!=='admin'){location.href='dashboard.html';return;}$('adminWelcome').textContent='Signed in as '+me.user.name+' · Manage all customer appointments';const data=await api('/api/appointments/all');const body=$('appointmentList');if(!data.length){body.innerHTML='<tr><td colspan="6" class="p-6 text-center text-gray-500">No appointments in the SQLite database yet. New customer bookings will appear here.</td></tr>';return;}body.innerHTML=data.map(a=>`<tr class="hover:bg-darkBg/40"><td class="p-4 whitespace-nowrap"><div class="text-white">${esc(a.appointment_date)}</div><div class="text-xs text-gray-500">${esc(a.start_time)} – ${esc(a.estimated_completion_time||'—')}</div><div class="text-xs text-gray-600">#${esc(a.id)}</div></td><td class="p-4"><div class="font-semibold text-white">${esc(a.client_name)}</div><div class="text-xs text-gray-500">User #${esc(a.user_id)}</div></td><td class="p-4"><div>${esc(a.service_name)}</div><div class="text-xs text-gray-500">${esc(a.hair_length)} hair · ${esc(a.stylist_name||'AURA Stylist')}</div></td><td class="p-4 text-brandGold font-bold whitespace-nowrap">${peso(a.total_price_php)}</td><td class="p-4"><span class="inline-block px-2.5 py-1 rounded-full border text-xs font-bold ${statusClass(a.status)}">${esc(a.status||'Pending')}</span></td><td class="p-4"><div class="flex flex-wrap gap-2"><select aria-label="Status for appointment ${Number(a.id)}" data-status="${Number(a.id)}" class="bg-darkBg border border-darkBorder rounded px-2 py-1 text-xs text-white"><option ${a.status==='Pending'?'selected':''}>Pending</option><option ${a.status==='Confirmed'?'selected':''}>Confirmed</option><option ${a.status==='In Progress'?'selected':''}>In Progress</option><option ${a.status==='Completed'?'selected':''}>Completed</option><option ${a.status==='Cancelled'?'selected':''}>Cancelled</option></select><button data-save="${Number(a.id)}" class="bg-brandGold text-black font-bold px-3 py-1 rounded text-xs">Save</button><button data-delete="${Number(a.id)}" class="bg-red-900/50 text-red-300 px-3 py-1 rounded text-xs">Delete</button></div></td></tr>`).join('');}catch(e){if(e.message==='Failed to fetch')show('Cannot reach the local server. Make sure node server.js is running.');else if(e.message.includes('Access denied')){show(e.message);setTimeout(()=>location.href='dashboard.html',1000);}else{show(e.message);}}}
$('appointmentList').addEventListener('click',async e=>{const save=e.target.closest('[data-save]');const del=e.target.closest('[data-delete]');if(save){const id=save.dataset.save;const select=$(`[data-status="${id}"]`);save.disabled=true;try{await api('/api/appointments/'+id,{method:'PUT',body:JSON.stringify({status:select.value})});show('Appointment #'+id+' status updated.',true);await load();}catch(err){show(err.message);}finally{save.disabled=false;}}if(del){const id=del.dataset.delete;if(!confirm('Permanently delete appointment #'+id+'?'))return;del.disabled=true;try{await api('/api/appointments/'+id,{method:'DELETE'});show('Appointment #'+id+' deleted.',true);await load();}catch(err){show(err.message);del.disabled=false;}}});
$('refreshBtn').addEventListener('click',load);$('logoutBtn').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST'});}finally{location.href='login.html';}});load();
</script></body></html>
